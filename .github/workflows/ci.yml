name: CI

# Added 2026-07-01 (audit correct-course): before this, the only workflow was
# the tag-triggered release, which runs no tests — a release could ship binaries
# built from an unreviewed [AutoSave] snapshot. This runs on every push,
# including the AutoSave stream, so corrupted snapshots surface immediately.

on:
  push:
    branches: [main, 'autosave/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lebo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: lebo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Vitest (standing-baseline ratchet)
        run: |
          pnpm vitest run --reporter=default --reporter=json --outputFile=vitest-report.json || true
          node scripts/ci-vitest-baseline.mjs vitest-report.json

  rust:
    # windows-latest matches the primary dev + release platform and compiles
    # the Tauri crate without extra system webview packages.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lebo/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lebo/src-tauri

      - name: cargo test (workspace)
        run: cargo test --workspace
